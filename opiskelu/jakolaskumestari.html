<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jakolaskumestari 🦉</title>
<style>
  :root{
    --ink:#2d2a4a;
    --soft:#6b6890;
    --card:#ffffff;
    --ok:#00b894;
    --okbg:#e3fbf2;
    --bad:#ff9f43;
    --badbg:#fff4e6;
    --pri:#6c5ce7;
    --pri2:#a29bfe;
    --tc:#6c5ce7;
    --tbg:#ece9ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    font-family:Nunito,"Segoe UI Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#a1c4fd 0%,#c2e9fb 30%,#fbc2eb 68%,#ffe29f 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  /* Taustan leijuvat koristeet */
  .deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .deco span{position:absolute;font-size:2.4rem;opacity:.35;animation:float 9s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-28px) rotate(12deg)}}

  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

  .app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:18px 14px 40px}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  h1{
    margin:0;font-size:clamp(1.6rem,5vw,2.5rem);font-weight:900;letter-spacing:.5px;
    color:#fff;text-shadow:0 3px 0 #6c5ce7,0 6px 14px rgba(108,92,231,.45);
  }
  h1 .owl{display:inline-block;animation:wiggle 3s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
  .iconbtn{
    border:none;background:#fff;border-radius:50%;width:48px;height:48px;font-size:1.4rem;cursor:pointer;
    box-shadow:0 4px 0 #c9c3f5;flex:none;
  }
  .iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9c3f5}

  .scorebar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pill{
    background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(45,42,74,.12);display:flex;align-items:center;gap:6px;
  }
  .pill b{font-size:1.25rem}
  .pill.ok b{color:var(--ok)}
  .pill.bad b{color:#e17055}
  .pill.streak b{color:#e84393}
  .pill.best b{color:#0984e3}
  .pill.hot{animation:hot 1s ease-in-out infinite alternate}
  @keyframes hot{from{box-shadow:0 0 0 rgba(255,118,117,.0)}to{box-shadow:0 0 18px rgba(255,118,117,.9)}}
  .bump{animation:bump .5s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  .hidden{display:none!important}

  .owlmsg{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 16px;
    box-shadow:0 6px 18px rgba(45,42,74,.12);margin-bottom:16px;font-size:1.1rem;font-weight:700;
  }
  .owlmsg .big{font-size:2.6rem;line-height:1}

  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .topic{
    border:none;text-align:left;cursor:pointer;border-radius:24px;padding:16px 16px 14px;
    background:var(--tbg);color:var(--ink);font:inherit;
    border-bottom:6px solid var(--tc);
    box-shadow:0 6px 16px rgba(45,42,74,.12);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .topic:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 12px 22px rgba(45,42,74,.18)}
  .topic:active{transform:translateY(2px)}
  .topic .ti{font-size:2.2rem}
  .topic .tn{font-size:1.2rem;font-weight:900;margin-top:4px}
  .topic .ts{font-size:.92rem;color:var(--soft);font-weight:700}
  .topic .tstat{margin-top:8px;font-size:.9rem;font-weight:800;color:var(--tc);min-height:1.1em}

  .linkbtn{background:none;border:none;color:var(--soft);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;margin-top:18px}

  .playtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .back{
    border:none;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer;
    box-shadow:0 4px 0 #c9c3f5;color:var(--ink);
  }
  .back:active{transform:translateY(3px);box-shadow:0 1px 0 #c9c3f5}
  .tag{background:var(--tc);color:#fff;border-radius:999px;padding:7px 14px;font-weight:900}
  .prog{margin-left:auto;font-weight:900;background:#fff;border-radius:999px;padding:7px 14px}

  .qcard{
    background:var(--card);border-radius:30px;padding:22px 20px 24px;
    box-shadow:0 14px 34px rgba(45,42,74,.18);
    border-top:10px solid var(--tc);
  }
  .qsub{font-weight:800;color:var(--tc);text-transform:uppercase;letter-spacing:1px;font-size:.85rem;margin-bottom:6px}
  .qemoji{font-size:3rem;text-align:center;line-height:1.1}
  .qeq{font-size:clamp(2rem,8vw,3rem);font-weight:900;text-align:center;margin:10px 0 18px;letter-spacing:1px;word-spacing:4px}
  .qword{font-size:1.3rem;line-height:1.55;font-weight:700;margin:6px 0 18px}
  .qbox{
    display:inline-block;min-width:1.4em;padding:0 .2em;border:4px dashed var(--tc);border-radius:14px;
    color:var(--tc);line-height:1.15;
  }
  .newq{animation:slidein .35s ease}
  @keyframes slidein{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

  form{display:flex;flex-direction:column;align-items:center;gap:14px}
  .inputs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end}
  .inp{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;color:var(--soft)}
  .inp .row{display:flex;align-items:center;gap:8px}
  .inp .unit{font-weight:800;color:var(--ink);font-size:1.1rem}
  input[type=text]{
    font:inherit;font-size:1.9rem;font-weight:900;text-align:center;color:var(--ink);
    width:170px;padding:8px 10px;border:4px solid var(--pri2);border-radius:18px;outline:none;background:#fbfaff;
  }
  input[type=text]:focus{border-color:var(--pri);box-shadow:0 0 0 6px rgba(108,92,231,.18)}
  input[type=text]:disabled{background:#f2f2f7}
  .shake{animation:shake .45s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{
    border:none;border-radius:18px;padding:13px 26px;font:inherit;font-size:1.2rem;font-weight:900;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,#8c7cff,#6c5ce7);box-shadow:0 6px 0 #4b3fb5;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4b3fb5}
  .btn.alt{background:linear-gradient(180deg,#ffe08a,#fdcb6e);color:#5a4300;box-shadow:0 6px 0 #d9a53a}
  .btn.alt:active{box-shadow:0 2px 0 #d9a53a}
  .btn.go{background:linear-gradient(180deg,#3ee0b0,#00b894);box-shadow:0 6px 0 #00876c}
  .btn.go:active{box-shadow:0 2px 0 #00876c}
  .btn:disabled{opacity:.5;cursor:default}

  .note{font-weight:800;color:#e17055;min-height:1.2em;text-align:center}
  .hint{background:#fff9db;border:3px dashed #fdcb6e;border-radius:18px;padding:10px 14px;font-weight:700;margin-top:14px}

  .fb{margin-top:16px;border-radius:22px;padding:14px 16px;font-size:1.08rem;line-height:1.5}
  .fb.ok{background:var(--okbg);border:3px solid var(--ok)}
  .fb.bad{background:var(--badbg);border:3px solid var(--bad)}
  .fb .head{font-size:1.35rem;font-weight:900;margin-bottom:4px}
  .fb.ok .head{color:#008a6c}
  .fb.bad .head{color:#d35400}
  .fb .ans{font-weight:900;font-size:1.2rem}
  .fb ol{margin:8px 0 0;padding-left:1.4em}
  .fb li{margin:4px 0;font-weight:700}
  .fb details summary{cursor:pointer;font-weight:800;color:#008a6c;margin-top:6px}
  .nextwrap{display:flex;justify-content:center;margin-top:16px}

  #praise{
    position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);
    z-index:60;pointer-events:none;font-size:clamp(2.4rem,10vw,4.6rem);font-weight:900;color:#fff;white-space:nowrap;
    text-shadow:0 4px 0 #e84393,0 8px 24px rgba(232,67,147,.55);
  }
  #praise.show{animation:praise 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes praise{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}
    25%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg);opacity:1}
    40%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    80%{transform:translate(-50%,-55%) scale(1);opacity:1}
    100%{transform:translate(-50%,-70%) scale(.9);opacity:0}
  }

  .summary{text-align:center}
  .stars{font-size:3.6rem;margin:6px 0;letter-spacing:6px}
  .stars span{display:inline-block;animation:starpop .6s cubic-bezier(.2,1.6,.4,1) both}
  .stars span.off{filter:grayscale(1);opacity:.3}
  @keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
  .bigscore{font-size:2.6rem;font-weight:900;color:var(--pri)}
  .missed{text-align:left;margin-top:16px}
  .missed .item{background:var(--badbg);border-radius:16px;padding:10px 14px;margin:10px 0;border-left:6px solid var(--bad)}
  .missed .q{font-weight:800}
  footer{text-align:center;color:var(--soft);font-weight:700;font-size:.9rem;margin-top:22px}
</style>
</head>
<body>

<div class="deco" aria-hidden="true">
  <span style="left:4%;top:10%;animation-delay:0s">➗</span>
  <span style="left:86%;top:8%;animation-delay:1.2s">⭐</span>
  <span style="left:10%;top:62%;animation-delay:2.1s">🍎</span>
  <span style="left:78%;top:55%;animation-delay:.6s">✨</span>
  <span style="left:46%;top:88%;animation-delay:3s">🎈</span>
  <span style="left:92%;top:84%;animation-delay:1.8s">➗</span>
  <span style="left:2%;top:90%;animation-delay:2.6s">💜</span>
  <span style="left:60%;top:4%;animation-delay:4s">🌈</span>
</div>

<canvas id="fx"></canvas>
<div id="praise"></div>

<main class="app">
  <header>
    <h1><span class="owl">🦉</span> Jakolaskumestari</h1>
    <button class="iconbtn" id="soundBtn" title="Äänet päälle/pois">🔊</button>
  </header>

  <section class="scorebar">
    <div class="pill ok">✅ Oikein <b id="sOk">0</b></div>
    <div class="pill bad">❌ Väärin <b id="sBad">0</b></div>
    <div class="pill streak" id="pStreak">🔥 Putki <b id="sStreak">0</b></div>
    <div class="pill best">🏆 Paras putki <b id="sBest">0</b></div>
  </section>

  <!-- VALIKKO -->
  <section id="menu">
    <div class="owlmsg"><span class="big">🦉</span><span id="owlText"></span></div>
    <div class="topics" id="topics"></div>
    <div style="text-align:center"><button class="linkbtn" id="resetBtn">Nollaa tilastot</button></div>
  </section>

  <!-- TEHTÄVÄ -->
  <section id="play" class="hidden">
    <div class="playtop">
      <button class="back" id="backBtn">⬅ Valikko</button>
      <span class="tag" id="topicTag"></span>
      <span class="prog hidden" id="examProg"></span>
    </div>
    <div class="qcard">
      <div id="qArea"></div>
      <form id="ansForm" autocomplete="off">
        <div class="inputs" id="inputs"></div>
        <div class="note" id="note"></div>
        <div class="btns" id="actionBtns">
          <button type="submit" class="btn go" id="checkBtn">Tarkista ✔</button>
          <button type="button" class="btn alt" id="hintBtn">Vihje 💡</button>
        </div>
      </form>
      <div class="hint hidden" id="hint"></div>
      <div id="feedback"></div>
      <div class="nextwrap"><button class="btn hidden" id="nextBtn">Seuraava ➜</button></div>
    </div>
  </section>

  <!-- HARJOITUSKOKEEN TULOS -->
  <section id="summary" class="hidden">
    <div class="qcard summary" id="sumCard"></div>
  </section>

  <footer>Tilastot tallentuvat tähän selaimeen. Tsemppiä kokeeseen! 💪</footer>
</main>

<script>
/* ================= APUFUNKTIOT ================= */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
// Suomalainen tapa: viisinumeroisista luvuista alkaen välilyönti tuhaterottimena
function fmt(n) {
  const s = String(Math.abs(n));
  const t = s.length < 5 ? s : s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '−' : '') + t;
}
const NAMES = ['Aino','Eino','Onni','Helmi','Veeti','Ella','Leo','Sofia','Eetu','Iida','Niilo','Venla','Lilja','Otso','Aada','Elias'];
const BOX = '<span class="qbox">?</span>';

function Q(topic, o) { return Object.assign({ topic, emoji: '', isWord: false, sub: '', hint: '', steps: [] }, o); }
const num = (value, unit) => ({ kind: 'num', value, unit: unit || '' });
const rem = (q, r, l0, l1, unit) => ({ kind: 'rem', q, r, labels: [l0, l1], unit: unit || '' });

// GEN-START
/* ================= 1. KERTOTAULUJAOT ================= */
function genTaulu() {
  const d = Math.random() < 0.08 ? 1 : rnd(2, 10);
  const x = Math.random();
  const q = x < 0.05 ? 0 : (x < 0.1 ? 1 : rnd(2, 10));
  const n = d * q;
  const form = Math.random();
  if (form < 0.7 || q === 0) {
    let steps;
    if (q === 0) steps = ['Kun 0 jaetaan millä tahansa luvulla, tulos on aina 0.', `Tarkistus: ${d} · 0 = 0 ✔`];
    else if (d === 1) steps = ['Kun luku jaetaan luvulla 1, tulos on sama luku.', `${n} : 1 = ${n}`, `Tarkistus: 1 · ${n} = ${n} ✔`];
    else steps = [`Mieti kertotaulua: ${d} · ? = ${n}`, `${d} · ${q} = ${n}`, `Siis ${n} : ${d} = ${q}.`];
    return Q('taulu', { html: `${n} : ${d} = ${BOX}`, answer: num(q), hint: `Mikä luku kerrottuna luvulla ${d} on ${n}?`, steps });
  }
  if (form < 0.85) {
    return Q('taulu', {
      html: `${BOX} : ${d} = ${q}`, answer: num(n), sub: 'Mikä luku puuttuu?',
      hint: `Jakolaskun voi tarkistaa kertolaskulla. Kerro luvut ${q} ja ${d}.`,
      steps: ['Jakolaskun voi kääntää kertolaskuksi.', `Puuttuva luku = ${q} · ${d} = ${n}`, `Tarkistus: ${n} : ${d} = ${q} ✔`]
    });
  }
  return Q('taulu', {
    html: `${n} : ${BOX} = ${q}`, answer: num(d), sub: 'Mikä luku puuttuu?',
    hint: `Millä luvulla ${n} pitää jakaa, että tulos on ${q}? Mieti: ${q} · ? = ${n}`,
    steps: [`Mieti: millä luvulla ${n} pitää jakaa, että tulokseksi tulee ${q}?`, `Se on sama kuin ${q} · ? = ${n}`, `${q} · ${d} = ${n}, joten puuttuva luku on ${d}.`]
  });
}

/* ================= 2. JAKOJÄÄNNÖS ================= */
function genJaannos() {
  const d = rnd(2, 10), q = rnd(1, 10);
  const r = Math.random() < 0.12 ? 0 : rnd(1, d - 1);
  const n = d * q + r;
  const steps = [
    `Etsi luvun ${d} kertotaulusta suurin luku, joka on enintään ${n}: ${d} · ${q} = ${d * q}.`,
    `(${d} · ${q + 1} = ${d * (q + 1)} on jo liian suuri.)`
  ];
  if (r === 0) steps.push(`Jako menee tasan, joten jakojäännös on 0.`, `Siis ${n} : ${d} = ${q}, jakojäännös 0.`);
  else steps.push(`Jakojäännös on se, mitä jää yli: ${n} − ${d * q} = ${r}.`, `Siis ${n} : ${d} = ${q}, jakojäännös ${r}.`,
    `Tarkistus: ${d} · ${q} + ${r} = ${n} ✔`, `Muista: jakojäännös on aina pienempi kuin jakaja.`);
  return Q('jaannos', {
    html: `${n} : ${d} = ${BOX}`, sub: 'Jako, jossa voi jäädä jakojäännös',
    answer: rem(q, r, 'Osamäärä', 'Jakojäännös'),
    hint: `Mikä on suurin luvun ${d} kertotaulun luku, joka ei ylitä lukua ${n}? Paljonko jää yli?`, steps
  });
}

/* ================= 3. JAKO 10, 100, 1000 ================= */
const ZEROS = { 10: 'yksi nolla', 100: 'kaksi nollaa', 1000: 'kolme nollaa' };
const PART = { 10: 'kymmenesosaan', 100: 'sadasosaan', 1000: 'tuhannesosaan' };
function genKymmen() {
  const D = pick([10, 10, 100, 100, 1000]);
  let q;
  if (D === 10) q = Math.random() < 0.5 ? rnd(2, 99) : rnd(100, 999);
  else if (D === 100) q = Math.random() < 0.7 ? rnd(2, 99) : rnd(100, 500);
  else q = Math.random() < 0.7 ? rnd(2, 20) : rnd(21, 99);
  const n = q * D;
  if (Math.random() < 0.2) {
    return Q('kymmen', {
      html: `${BOX} : ${fmt(D)} = ${fmt(q)}`, answer: num(n), sub: 'Mikä luku puuttuu?',
      hint: `Mikä luku jaettuna luvulla ${D} on ${fmt(q)}? Käännä kertolaskuksi.`,
      steps: [`Jakolaskun voi kääntää kertolaskuksi: ? = ${fmt(q)} · ${D}.`, `Kun kerrotaan luvulla ${D}, luvun perään lisätään ${ZEROS[D]}.`,
        `${fmt(q)} · ${D} = ${fmt(n)}`, `Tarkistus: ${fmt(n)} : ${D} = ${fmt(q)} ✔`]
    });
  }
  return Q('kymmen', {
    html: `${fmt(n)} : ${fmt(D)} = ${BOX}`, answer: num(q),
    hint: `Montako nollaa luvussa ${D} on? Ota yhtä monta nollaa pois luvun ${fmt(n)} lopusta.`,
    steps: [`Kun jaetaan luvulla ${D}, luku pienenee ${PART[D]}.`, `Käytännössä luvun lopusta otetaan pois ${ZEROS[D]}.`,
      `${fmt(n)} : ${D} = ${fmt(q)}`, `Tarkistus: ${fmt(q)} · ${D} = ${fmt(n)} ✔`]
  });
}

/* ================= 4. LASKUJÄRJESTYS ================= */
function genJarj() {
  const R_MD = 'Kerto- ja jakolaskut lasketaan ennen yhteen- ja vähennyslaskuja.';
  const R_P = 'Sulkeissa oleva lasku lasketaan ensimmäisenä.';
  const R_LR = 'Kerto- ja jakolaskut lasketaan järjestyksessä vasemmalta oikealle.';
  const c = rnd(2, 9), k = rnd(2, 9);
  let expr, steps, chain, ans;
  switch (rnd(1, 10)) {
    case 1: { const a = rnd(2, 30), b = c * k; ans = a + k; expr = `${a} + ${b} : ${c}`;
      steps = [R_MD, `Ensin jakolasku: ${b} : ${c} = ${k}`, `Sitten yhteenlasku: ${a} + ${k} = ${ans}`]; chain = `${a} + ${k} = ${ans}`; break; }
    case 2: { const a = rnd(2, 30), b = c * k; ans = k + a; expr = `${b} : ${c} + ${a}`;
      steps = [R_MD, `Ensin jakolasku: ${b} : ${c} = ${k}`, `Sitten yhteenlasku: ${k} + ${a} = ${ans}`]; chain = `${k} + ${a} = ${ans}`; break; }
    case 3: { const a = k + rnd(1, 25), b = c * k; ans = a - k; expr = `${a} − ${b} : ${c}`;
      steps = [R_MD, `Ensin jakolasku: ${b} : ${c} = ${k}`, `Sitten vähennyslasku: ${a} − ${k} = ${ans}`]; chain = `${a} − ${k} = ${ans}`; break; }
    case 4: { const a = rnd(1, k - 1), b = c * k; ans = k - a; expr = `${b} : ${c} − ${a}`;
      steps = [R_MD, `Ensin jakolasku: ${b} : ${c} = ${k}`, `Sitten vähennyslasku: ${k} − ${a} = ${ans}`]; chain = `${k} − ${a} = ${ans}`; break; }
    case 5: { const s = c * k, a = rnd(1, s - 1), b = s - a; ans = k; expr = `(${a} + ${b}) : ${c}`;
      steps = [R_P, `Ensin sulkeet: ${a} + ${b} = ${s}`, `Sitten jakolasku: ${s} : ${c} = ${k}`]; chain = `${s} : ${c} = ${k}`; break; }
    case 6: { const s = c * k, b = rnd(1, 20), a = s + b; ans = k; expr = `(${a} − ${b}) : ${c}`;
      steps = [R_P, `Ensin sulkeet: ${a} − ${b} = ${s}`, `Sitten jakolasku: ${s} : ${c} = ${k}`]; chain = `${s} : ${c} = ${k}`; break; }
    case 7: { const a = c * k, m = rnd(2, 5); ans = k * m; expr = `${a} : ${c} · ${m}`;
      steps = [R_LR, `Ensin jakolasku: ${a} : ${c} = ${k}`, `Sitten kertolasku: ${k} · ${m} = ${ans}`]; chain = `${k} · ${m} = ${ans}`; break; }
    case 8: { const a = rnd(2, 9), b = rnd(2, 9), x = a * b, e = c * k; ans = x + k; expr = `${a} · ${b} + ${e} : ${c}`;
      steps = [R_MD, `Kertolasku: ${a} · ${b} = ${x}`, `Jakolasku: ${e} : ${c} = ${k}`, `Lopuksi yhteenlasku: ${x} + ${k} = ${ans}`]; chain = `${x} + ${k} = ${ans}`; break; }
    case 9: { const k1 = rnd(3, 10), k2 = rnd(1, k1 - 1), b = rnd(2, 9), d = rnd(2, 9), a = b * k1, e = d * k2; ans = k1 - k2;
      expr = `${a} : ${b} − ${e} : ${d}`;
      steps = [R_MD, `Ensimmäinen jakolasku: ${a} : ${b} = ${k1}`, `Toinen jakolasku: ${e} : ${d} = ${k2}`, `Lopuksi vähennyslasku: ${k1} − ${k2} = ${ans}`]; chain = `${k1} − ${k2} = ${ans}`; break; }
    default: { const s = rnd(3, 10), b = rnd(1, s - 1), e = s - b, a = s * k; ans = k; expr = `${a} : (${b} + ${e})`;
      steps = [R_P, `Ensin sulkeet: ${b} + ${e} = ${s}`, `Sitten jakolasku: ${a} : ${s} = ${k}`]; chain = `${a} : ${s} = ${k}`; break; }
  }
  steps.push(`Koko lasku: ${expr} = ${chain}`);
  return Q('jarj', {
    html: `${expr} = ${BOX}`, sub: 'Muista laskujärjestys!', answer: num(ans), expr,
    hint: 'Järjestys: 1) sulkeet, 2) kerto- ja jakolaskut vasemmalta oikealle, 3) yhteen- ja vähennyslaskut vasemmalta oikealle.', steps
  });
}

// Pilkotaan jaettava osiin (satoja, kymmeniä, ykkösiä) niin, että jokainen osa jakautuu tasan.
function splitUnits(n, d) {
  const digits = String(n).split('').map(Number);
  let carry = 0; const chunks = [];
  digits.forEach((dig, i) => {
    const place = 10 ** (digits.length - 1 - i);
    const cur = carry * 10 + dig;
    const qd = Math.floor(cur / d);
    carry = cur - qd * d;
    if (qd > 0) chunks.push({ value: qd * d * place, place, small: qd * d, res: qd * place, smallRes: qd });
  });
  return chunks;
}
function unitSteps(n, d) {
  const ch = splitUnits(n, d);
  const s = [`Jaetaan luku ${n} osiin, jotka on helppo jakaa luvulla ${d}:`, `${n} = ${ch.map(c => c.value).join(' + ')}`];
  ch.forEach(c => s.push(`${c.value} : ${d} = ${c.res}` + (c.place > 1 ? `  (koska ${c.small} : ${d} = ${c.smallRes})` : '')));
  s.push(`Lopuksi osat yhteen: ${ch.map(c => c.res).join(' + ')} = ${n / d}`);
  return { steps: s, chunks: ch };
}
function genYks() {
  let n, d, q, u;
  do {
    d = rnd(2, 9);
    if (Math.random() < 0.35) q = rnd(11, Math.floor(99 / d));
    else q = rnd(Math.max(11, Math.ceil(100 / d)), Math.floor(999 / d));
    n = q * d; u = unitSteps(n, d);
  } while (u.chunks.length < 2);
  return Q('yks', {
    html: `${n} : ${d} = ${BOX}`, sub: 'Laske lukuyksiköittäin', answer: num(q),
    hint: `Jaa luku ensin osiin: ${n} = ${u.chunks.map(c => c.value).join(' + ')}. Jaa sitten jokainen osa luvulla ${d} ja laske tulokset yhteen.`,
    steps: u.steps
  });
}

      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > H + 60) { p.alive = false; continue; }
      g.save(); g.globalAlpha = Math.max(0, Math.min(1, p.life)); g.translate(p.x, p.y); g.rotate(p.rot);
      if (p.type === 'rect') { g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2))); }
      else if (p.type === 'dot') { g.fillStyle = p.c; g.beginPath(); g.arc(0, 0, p.r, 0, Math.PI * 2); g.fill(); }
      else { g.font = `${p.s}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.e, 0, 0); }
      g.restore();
    }
    if (parts.length) requestAnimationFrame(loop); else { running = false; g.clearRect(0, 0, W, H); }
  }
  const P = o => Object.assign({ alive: true, rot: 0, vr: 0, drag: 0.99, g: 0.25, life: 1, decay: 0.004 }, o);
  function confetti() {
    for (let side = 0; side < 2; side++) for (let i = 0; i < 90 * AMT; i++) {
      const dir = side === 0 ? 1 : -1;
      parts.push(P({ type: 'rect', x: side === 0 ? -10 : W + 10, y: H * 0.85,
        vx: dir * (4 + Math.random() * 12), vy: -(10 + Math.random() * 13), w: 8 + Math.random() * 6, h: 12 + Math.random() * 8,
        c: pick(COLORS), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, drag: 0.985, g: 0.32, decay: 0.003 }));
    }
    start();
  }
  function fireworks() {
    for (let b = 0; b < 4; b++) setTimeout(() => {
      const x = W * (0.2 + Math.random() * 0.6), y = H * (0.15 + Math.random() * 0.3), c = pick(COLORS);
      for (let i = 0; i < 70 * AMT; i++) {
        const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6;
        parts.push(P({ type: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 2 + Math.random() * 2.5,
          c: Math.random() < 0.7 ? c : '#fff', drag: 0.96, g: 0.06, decay: 0.014 + Math.random() * 0.01 }));
      }
      start();
    }, b * 260);
  }
  function emojiRain() {
    for (let i = 0; i < 45 * AMT; i++) parts.push(P({ type: 'emoji', e: pick(EMOJIS), x: Math.random() * W, y: -30 - Math.random() * H * 0.7,
      vx: (Math.random() - 0.5) * 1.5, vy: 2 + Math.random() * 3, s: 24 + Math.random() * 22, vr: (Math.random() - 0.5) * 0.08,
      drag: 1, g: 0.04, decay: 0.002 }));
    start();
  }
  function starBurst() {
    const x = W / 2, y = H * 0.4;
    for (let i = 0; i < 36 * AMT; i++) {
      const a = (i / 36) * Math.PI * 2, v = 6 + Math.random() * 6;
      parts.push(P({ type: 'emoji', e: pick(['⭐', '🌟', '✨']), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 22 + Math.random() * 20,
        vr: (Math.random() - 0.5) * 0.2, drag: 0.95, g: 0.12, decay: 0.012 }));
    }
    start();
  }
  return {
    small() { pick([confetti, fireworks, emojiRain, starBurst])(); },
    big() { confetti(); fireworks(); emojiRain(); }
  };
})();

function praise(text) {
  const el = $('#praise'); el.textContent = text;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

/* ================= KÄYTTÖLIITTYMÄ ================= */
const PRAISE = ['Oikein! 🎉', 'Mahtavaa! 🌟', 'Loistavaa! ✨', 'Huippua! 🚀', 'Nappiin! 🎯', 'Taitava! 🦉', 'Super! 💫', 'Jee! 🥳', 'Hienoa! 🌈', 'Täysosuma! 🏅'];
const OOPS = ['Ei aivan – mutta virheistä oppii! 💪', 'Melkein! Katsotaan yhdessä, miten se menee. 🦉', 'Ei haittaa! Seuraavalla kerralla onnistut. 🌱', 'Hyvä yritys! Katso ratkaisu tarkkaan. 🔍'];

let state = { topic: null, cur: null, answered: false, exam: null, lastHtml: '' };

function setTheme(t) { document.documentElement.style.setProperty('--tc', t.tc); document.documentElement.style.setProperty('--tbg', t.tbg); }
function show(id) { ['#menu', '#play', '#summary'].forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function renderMenu() {
  const box = $('#topics'); box.innerHTML = '';
  TOPICS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'topic'; b.style.setProperty('--tc', t.tc); b.style.setProperty('--tbg', t.tbg);
    let stat = '';
    const st = S.topics[t.id];
    if (st && (st.ok || st.bad)) stat = `✔ ${st.ok}  ·  ✘ ${st.bad}`;
    if (t.exam && S.examBest !== null) stat = `Paras tulos: ${S.examBest}/10`;
    b.innerHTML = `<div class="ti">${t.icon}</div><div class="tn">${t.name}</div><div class="ts">${t.sub}</div><div class="tstat">${stat}</div>`;
    b.onclick = () => startTopic(t.id);
    box.appendChild(b);
  });
  $('#owlText').textContent = S.ok === 0
    ? 'Hei! Minä olen Pöllö-ope. Valitse aihe, niin aletaan harjoitella jakolaskuja!'
    : pick([`Olet jo ratkaissut ${S.ok} tehtävää oikein. Jatketaan!`, 'Mitä harjoitellaan seuraavaksi?', 'Harjoituskoe kertoo, miten olet valmis kokeeseen!', 'Jokainen tehtävä tekee sinusta taitavamman! 🌟']);
}

function startTopic(id) {
  const t = T[id]; state.topic = id; setTheme(t);
  $('#topicTag').textContent = `${t.icon} ${t.name}`;
  state.exam = t.exam ? { list: shuffle(EXAM_PLAN.slice()), idx: 0, results: [] } : null;
  $('#examProg').classList.toggle('hidden', !t.exam);
  show('#play'); nextQuestion();
}

function generate() {
  let id = state.topic;
  if (state.exam) id = state.exam.list[state.exam.idx];
  else if (id === 'mix') id = pick(MIX_WEIGHTS);
  return T[id].gen();
}

function nextQuestion() {
  if (state.exam && state.exam.idx >= state.exam.list.length) return showSummary();
  let q, tries = 0;
  do { q = generate(); tries++; } while (q.html === state.lastHtml && tries < 10);
  state.cur = q; state.lastHtml = q.html; state.answered = false;
  if (state.exam) $('#examProg').textContent = `Tehtävä ${state.exam.idx + 1}/${state.exam.list.length}`;

  const qa = $('#qArea');
  qa.innerHTML = (q.sub ? `<div class="qsub">${q.sub}</div>` : '') +
    (q.isWord ? `<div class="qemoji">${q.emoji}</div><div class="qword">${q.html}</div>` : `<div class="qeq">${q.html}</div>`);
  qa.classList.remove('newq'); void qa.offsetWidth; qa.classList.add('newq');

  renderInputs(q.answer);
  $('#note').textContent = '';
  $('#hint').classList.add('hidden');
  $('#feedback').innerHTML = '';
  $('#nextBtn').classList.add('hidden');
  $('#actionBtns').classList.remove('hidden');
  setTimeout(() => $('#in0') && $('#in0').focus(), 50);
}

function renderInputs(a) {
  const field = (id, label, unit) =>
    `<label class="inp"><span>${label}</span><span class="row"><input type="text" id="${id}" inputmode="numeric" autocomplete="off" maxlength="9">${unit ? `<span class="unit">${unit}</span>` : ''}</span></label>`;
  $('#inputs').innerHTML = a.kind === 'num'
    ? field('in0', 'Vastaus', a.unit)
    : field('in0', a.labels[0], '') + field('in1', a.labels[1], '');
}

function parseNum(s) {
  const t = String(s).replace(/[\s ]/g, '').replace('−', '-');
  return /^-?\d+$/.test(t) ? Number(t) : NaN;
}
function answerText(a) {
  if (a.kind === 'num') return fmt(a.value) + (a.unit ? ' ' + a.unit : '');
  return `${a.labels[0].toLowerCase()} ${a.q}, ${a.labels[1].toLowerCase()} ${a.r}`;
}
function nudge(msg, el) {
  $('#note').textContent = msg;
  const t = el || $('#in0'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); t.focus();
}

function check(e) {
  e.preventDefault();
  if (state.answered) return;
  const a = state.cur.answer;
  const in0 = $('#in0'), v0 = parseNum(in0.value);
  if (in0.value.trim() === '') return nudge('Kirjoita vastaus ensin 🙂');
  if (isNaN(v0)) return nudge('Kirjoita vastaukseksi pelkkä luku, esimerkiksi 12.');
  let ok, given;
  if (a.kind === 'num') { ok = v0 === a.value; given = fmt(v0); }
  else {
    const in1 = $('#in1'), raw = in1.value.trim();
    const v1 = raw === '' ? 0 : parseNum(raw);   // tyhjä jakojäännös = 0
    if (isNaN(v1)) return nudge('Kirjoita jakojäännökseksi pelkkä luku.', in1);
    ok = v0 === a.q && v1 === a.r;
    given = `${a.labels[0].toLowerCase()} ${v0}, ${a.labels[1].toLowerCase()} ${v1}`;
  }
  state.answered = true;
  document.querySelectorAll('#inputs input').forEach(i => i.disabled = true);
  $('#actionBtns').classList.add('hidden');
  $('#note').textContent = '';

  const tid = state.cur.topic;
  S.topics[tid] = S.topics[tid] || { ok: 0, bad: 0 };
  const steps = `<ol>${state.cur.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;

  if (ok) {
    S.ok++; S.streak++; S.best = Math.max(S.best, S.streak); S.topics[tid].ok++;
    const milestone = S.streak % 5 === 0 || S.ok % 25 === 0;
    if (milestone) {
      fx.big(); snd.big();
      praise(S.streak % 5 === 0 ? `🔥 ${S.streak} putkeen!` : `🏅 ${S.ok} oikein!`);
    } else { fx.small(); snd.ok(); praise(pick(PRAISE)); }
    $('#feedback').innerHTML = `<div class="fb ok"><div class="head">✔ ${pick(PRAISE)}</div>
      <div>Vastaus: <span class="ans">${answerText(state.cur.answer)}</span></div>
      <details><summary>Katso ratkaisu</summary>${steps}</details></div>`;
    renderScore('#sOk');
  } else {
    S.bad++; S.streak = 0; S.topics[tid].bad++;
    snd.bad(); in0.classList.remove('shake'); void in0.offsetWidth; in0.classList.add('shake');
    $('#feedback').innerHTML = `<div class="fb bad"><div class="head">${pick(OOPS)}</div>
      <div>Sinun vastauksesi: <b>${given}</b></div>
      <div>Oikea vastaus: <span class="ans">${answerText(state.cur.answer)}</span></div>
      <div style="margin-top:8px;font-weight:900">Näin se lasketaan:</div>${steps}</div>`;
    renderScore('#sBad');
  }
  save();

  if (state.exam) {
    state.exam.results.push({ q: state.cur, ok, given });
    state.exam.idx++;
  }
  const nb = $('#nextBtn');
  nb.textContent = state.exam && state.exam.idx >= state.exam.list.length ? 'Katso tulos 🏁' : 'Seuraava ➜';
  nb.classList.remove('hidden');
  setTimeout(() => nb.focus(), 30);
}

function showSummary() {
  const res = state.exam.results, score = res.filter(r => r.ok).length;
  S.examBest = S.examBest === null ? score : Math.max(S.examBest, score); save();
  const stars = score >= 9 ? 3 : score >= 7 ? 2 : score >= 5 ? 1 : 0;
  const msg = score === 10 ? 'Täydellinen! Olet todellinen jakolaskumestari! 🏆'
    : score >= 8 ? 'Upeaa! Olet tosi hyvin valmis kokeeseen! 🌟'
    : score >= 6 ? 'Hyvä! Vielä vähän harjoitusta, niin olet huippu! 💪'
    : 'Hyvä yritys! Harjoittele vielä aiheita, joissa tuli virheitä – kyllä se siitä! 🌱';
  const missed = res.filter(r => !r.ok).map(r => `<div class="item">
      <div class="q">${T[r.q.topic].icon} ${r.q.isWord ? r.q.html : r.q.html.replace(/<span class="qbox">\?<\/span>/g, '?')}</div>
      <div>Sinun vastauksesi: ${r.given} · Oikea: <b>${answerText(r.q.answer)}</b></div>
      <details><summary>Katso ratkaisu</summary><ol>${r.q.steps.map(s => `<li>${s}</li>`).join('')}</ol></details></div>`).join('');
  $('#sumCard').innerHTML = `
    <div class="qemoji">${score >= 7 ? '🏆' : '🦉'}</div>
    <h2 style="margin:4px 0">Harjoituskoe valmis!</h2>
    <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}" style="animation-delay:${0.2 + i * 0.25}s">⭐</span>`).join('')}</div>
    <div class="bigscore">${score} / 10</div>
    <p style="font-size:1.2rem;font-weight:800">${msg}</p>
    ${missed ? `<div class="missed"><h3>Kertaa nämä:</h3>${missed}</div>` : ''}
    <div class="btns" style="margin-top:18px">
      <button class="btn go" id="againBtn">Uusi harjoituskoe 📝</button>
      <button class="btn alt" id="menuBtn2">Valikkoon 🏠</button>
    </div>`;
  show('#summary');
  if (score >= 7) { setTimeout(() => { fx.big(); snd.big(); }, 300); }
  $('#againBtn').onclick = () => startTopic('koe');
  $('#menuBtn2').onclick = () => { renderMenu(); show('#menu'); };
}

/* ================= TAPAHTUMAT ================= */
$('#ansForm').addEventListener('submit', check);
$('#nextBtn').addEventListener('click', nextQuestion);
$('#hintBtn').addEventListener('click', () => { const h = $('#hint'); h.innerHTML = '💡 ' + state.cur.hint; h.classList.remove('hidden'); $('#in0').focus(); });
$('#backBtn').addEventListener('click', () => { renderMenu(); show('#menu'); });
$('#soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); $('#soundBtn').textContent = S.sound ? '🔊' : '🔇'; });
$('#resetBtn').addEventListener('click', () => {
  if (confirm('Haluatko varmasti nollata kaikki tilastot?')) {
    const sound = S.sound; S = load(); Object.assign(S, { ok: 0, bad: 0, streak: 0, best: 0, topics: {}, examBest: null, sound }); save(); renderScore(); renderMenu();
  }
});

$('#soundBtn').textContent = S.sound ? '🔊' : '🔇';
renderScore(); renderMenu();
</script>
</body>
